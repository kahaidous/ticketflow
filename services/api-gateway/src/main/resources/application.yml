server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # DISCOVERY LOCATOR (step-03): instead of writing one route per service, the gateway
          # asks Eureka which services exist and creates a route for each of them, on its own.
          # For a service registered as "customer-service" it builds:
          #   predicate -> Path=/customer-service/**
          #   target    -> lb://customer-service   (load-balanced over all its instances)
          #   filter    -> RewritePath that removes the "/customer-service" prefix
          # so GET /customer-service/api/customers on the gateway reaches GET /api/customers
          # on the service. A new microservice becomes reachable with NO change here.
          # Eureka registers names in UPPER CASE: lower-case-service-id keeps the URLs readable.
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # DEFAULT FILTERS are applied to every route, including the ones created by the
          # locator. FILTERS = actions applied to the request BEFORE it is sent to the backend
          # and/or to the response BEFORE it is returned to the client.
          # Other common filters:
          #   - AddRequestHeader=X-Request-Source, gateway   add a header to the request
          #   - Retry / CircuitBreaker / RequestRateLimiter  resilience filters (later steps)
          default-filters:
            - AddResponseHeader=X-Served-By, api-gateway

          # The same thing written by hand (explicit route, as in step-02 but with lb://).
          # Use explicit routes when you want full control over what is exposed and how:
          # a ROUTE answers 3 questions: WHERE (id + uri), WHEN (predicates), WHAT (filters).
          #
          # routes:
          #   - id: customer-service
          #     uri: lb://customer-service
          #     predicates:
          #       - Path=/api/customers/**       # all predicates must match (AND); no match -> 404
          #     filters:
          #       - AddResponseHeader=X-Served-By, api-gateway

eureka:
  client:
    service-url:
      # Where the Eureka server is. Overridden by EUREKA_URL in Docker Compose.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        # "gateway" exposes /actuator/gateway/routes to list the routes the gateway knows
        include: health,info,gateway
