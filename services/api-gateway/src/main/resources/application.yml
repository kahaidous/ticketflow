server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # Central configuration (step-05). "optional:" = start anyway if the Config Server is down.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - AddResponseHeader=X-Served-By, api-gateway

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
